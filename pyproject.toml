[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleplay-agent"
version = "0.1.0"
description = "Local, Ollama-powered companion chat agent with memory."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "playwright>=1.45",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
# Section C - local TTS, "qwen3" backend (see services/tts/tts.py).
# Apple Silicon only (mlx-audio depends on mlx, which only ships
# macOS/arm64 wheels) - kept out of the base dependency set so installing/
# running the app elsewhere is unaffected; every voice request just 503s
# with a clear message until the backend configured in configs/tts.yaml
# has its extra installed.
tts = ["mlx-audio>=0.5"]
# Section C - local TTS, "chatterbox" backend (see services/tts/tts.py).
# Cross-platform (plain PyTorch, CPU/CUDA/MPS) unlike the mlx-audio-based
# "qwen3" backend above - pulls in torch/transformers-sized weights, so
# kept as its own optional extra rather than a base dependency.
tts-chatterbox = ["chatterbox-tts>=0.1.4", "huggingface-hub>=0.24"]
# Section A3 - local STT (see services/stt/stt.py), shared by two
# fallbacks: transcript/media.py's no-captions-found path for a
# persona-source URL, and voice mode's non-audio-model path (used by
# agent/voice.py when a persona's model can't take audio directly). Any
# Hugging Face `transformers` automatic-speech-recognition-pipeline-
# compatible model, not pinned to one engine - configs/transcript.yaml's
# `model_repo` picks which. Kept optional since it pulls in torch-sized
# weights and downloads model checkpoints at runtime; both caller's
# primary paths (captions when they exist; a real audio-capable model)
# work without it, and every fallback request just 422s with a clear
# message until this is installed.
transcribe = ["transformers>=4.40", "torch>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/roleplay_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Line length matches the wrapping already used throughout src/ (comments
# and docstrings routinely run ~100-110 chars) - not an arbitrary default.
[tool.ruff]
# 120, not the 88/79 default - this codebase's explanatory "why" comments
# (see docs/ARCHITECTURE.md's "Design decisions") routinely run long, and
# reflowing them for a stricter limit would fight the existing style.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors (the baseline). I: import sorting -
# this codebase's imports are already grouped stdlib/third-party/local by
# hand, so isort's checks just enforce what's already the convention.
select = ["E", "F", "I"]
