[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleplay-agent"
version = "0.1.0"
description = "Local, Ollama-powered companion chat agent with memory."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "playwright>=1.45",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
# Section C - local TTS (see llm/tts.py). Apple Silicon only (mlx-audio
# depends on mlx, which only ships macOS/arm64 wheels) - kept out of the
# base dependency set so installing/running the app elsewhere is unaffected;
# every voice request just 503s with a clear message until this is installed.
tts = ["mlx-audio>=0.5"]
# Section A3 - local Whisper transcription fallback for URLs with no
# captions (see transcript/media.py). Kept optional since it pulls in
# ctranslate2/torch-sized weights and downloads model checkpoints at
# runtime; the caption-first path (most URLs) works without it, and every
# audio-fallback request just 422s with a clear message until this is
# installed.
transcribe = ["faster-whisper>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/roleplay_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Line length matches the wrapping already used throughout src/ (comments
# and docstrings routinely run ~100-110 chars) - not an arbitrary default.
[tool.ruff]
# 120, not the 88/79 default - this codebase's explanatory "why" comments
# (see docs/ARCHITECTURE.md's "Design decisions") routinely run long, and
# reflowing them for a stricter limit would fight the existing style.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors (the baseline). I: import sorting -
# this codebase's imports are already grouped stdlib/third-party/local by
# hand, so isort's checks just enforce what's already the convention.
select = ["E", "F", "I"]
