# Section C - local text-to-speech. Backend is pluggable - see
# services/tts/tts.py - so no TTS model is ever hardcoded in code, only
# read from whichever of the blocks below `backend` selects.
#
# "chatterbox": Resemble AI's Chatterbox-Turbo (github.com/resemble-ai/
# chatterbox) via the `chatterbox-tts` pip package (`pip install
# '.[tts-chatterbox]'`). Plain PyTorch - runs on CPU/CUDA/MPS, not Apple
# Silicon only. No curated preset speakers like "qwen3" below has - every
# `voice:` a persona sets must name a cloned reference clip under
# data/voice_samples/ (see docs/AUDIO.md).
#
# "qwen3": mlx-audio's Qwen3-TTS CustomVoice model (`pip install '.[tts]'`).
# Apple Silicon only (mlx-audio depends on mlx). See docs/ARCHITECTURE.md's
# "Local text-to-speech" for the benchmarks that made this the original
# default before the chatterbox backend above existed.
backend: chatterbox

chatterbox:
  # Real Hugging Face repo id - not resemble-ai/chatterbox's own hardcoded
  # default (ResembleAI/chatterbox-turbo the class constant), fetched via
  # our own huggingface_hub.snapshot_download so switching to a fine-tune
  # or the "nano" checkpoint is a config edit, never a code change.
  model_repo: YOUR-VOICE-CLONE-MODEL # ResembleAI/chatterbox-turbo
  # int8 | none. Dynamic PyTorch quantization of T3 (the text-to-speech-
  # token transformer)'s Linear layers only - PyTorch's dynamic
  # quantization is CPU-only, so this is silently skipped if the
  # auto-detected device (cuda/mps preferred over cpu - not a config knob,
  # see services/tts/tts.py's _detect_chatterbox_device) isn't cpu. S3Gen
  # (the conv-heavy vocoder half of the model) is left unquantized; dynamic
  # quantization doesn't cover conv layers.
  quantize: Q

qwen3:
  # Model weights aren't checked in - mlx-audio resolves and caches this
  # repo id from Hugging Face on first use (~1GB, one-time).
  #
  # 4-bit, not 8-bit: verified live on this machine - cached load time
  # 3.2s -> 1.5s, real-time-factor ~1.2x -> ~2.5x, time-to-first-audio-chunk
  # 0.88s -> 0.33s, all roughly halved or better, at some voice-quality
  # cost to be judged by ear. Revert to the -8bit repo id if that cost
  # isn't worth it.
  model_repo: YOUR-VOICE-CLONE-MODEL # mlx-community/Qwen3-TTS-12Hz-0.6B-Base-6bit
  # The voice-cloning checkpoint - used automatically whenever a persona's
  # `voice:` names a WAV under data/voice_samples/ instead of one of
  # llm.tts.SUPPORTED_VOICES's curated presets (see
  # scripts/extract_audio_sample.py for producing one). Much smaller than
  # the preset model above, so this is only ever loaded on demand, never
  # alongside it.
  clone_model_repo: YOUR-VOICE-CLONE-CHECKPOINT # mlx-community/Qwen3-TTS-12Hz-0.6B-Base-6bit-VoiceClone

# Caps how much of a reply gets synthesized in one call - keeps worst-case
# request time bounded rather than growing unbounded with an unusually long
# reply. Applies to both backends.
max_chars: 1200
