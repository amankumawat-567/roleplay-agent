# Application behavior around chat generation - config/settings.py's
# AppConfig (not env-overridable, unlike configs/app.yaml's host/port - see
# docs/architecture.md's "Config hygiene").
# No default_model here - "the default" is computed at the moment it's
# needed (the most recently pulled/updated chat-capable model), never a
# name baked into this file. See llm/capabilities.py.
keep_alive: "30m" # keep the Ollama model (and its KV cache) resident between chat turns
keep_last_messages: 20 # raw messages kept verbatim; older ones get folded into the running summary
default_num_ctx: 8192 # Ollama defaults to 2048 regardless of the model's real max context
embedding_model: YOUR-EMBEDDING-MODEL # `ollama pull all-minilm:22m` - only needed if a game sets memory_recall: true

# Maps to Ollama's "think" option via langchain_ollama's ChatOllama
# `reasoning` field - applied to every Ollama chat call (personas, the
# builder chat, research/memory summarization, voice mode), not just one.
# false disables reasoning output on models that support toggling it (e.g.
# Qwen3-style thinking models) so replies come back as plain text with no
# <think> block to strip. Ignored entirely for openai/anthropic providers.
enable_thinking: false
