# Settings for section A3's universal URL-transcript import (transcript/media.py).
# Caps how much transcript text reaches the draft-generation prompt - bounds
# prompt size regardless of how long the source video actually is.
max_chars: 20000

# Local speech-to-text via Hugging Face `transformers`' generic
# automatic-speech-recognition pipeline (see services/stt/stt.py) - any
# pipeline-compatible repo id works, not just Whisper (Wav2Vec2, HuBERT,
# Distil-Whisper, Moonshine, a Whisper variant, a fine-tune, ...), never
# one particular model baked into code. Used both when a URL has no
# captions to fall back on (transcript/media.py) and for voice mode's own
# transcription fallback (dispatched from api/routes/gameplay/chat.py's
# /voice-turn). Device (cuda/mps/cpu) is always auto-detected from what
# this machine's torch build actually supports - not a config knob, no
# reason to make anyone guess their own hardware.
model_repo: YOUR-SPEECH-TO-TEXT-MODEL
# int8 | none. Dynamic PyTorch quantization of the model's Linear layers
# only (mirrors configs/tts.yaml's chatterbox.quantize) - CPU-only, since
# PyTorch's dynamic quantization backend doesn't support cuda/mps, so this
# is silently skipped if the auto-detected device (services/stt/stt.py's
# _detect_device) isn't cpu.
quantize: Q
